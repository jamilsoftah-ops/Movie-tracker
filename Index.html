<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Watch List</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f6f3f8; --surface: #ffffff; --text: #1d1730; --muted: #6b6480; --line: #e2dcec; --accent: #6a3df0; --accent-text: #ffffff; --danger: #c43d4b; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #130f1f; --surface: #1d1730; --text: #f1ecfa; --muted: #a39bb8; --line: #2f2748; --accent: #8f6bff; --accent-text: #130f1f; --danger: #ff7a87; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #130f1f; --surface: #1d1730; --text: #f1ecfa; --muted: #a39bb8; --line: #2f2748; --accent: #8f6bff; --accent-text: #130f1f; --danger: #ff7a87; color-scheme: dark; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
.sr { position: absolute; left: -9999px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; } .row > * { flex: 1 1 130px; }
input, select, button { font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.svc-row { display: flex; gap: 8px; margin-bottom: 10px; }
.disney-btn { flex: 1; background: #1b3b8f; color: #fff; border: none; font-weight: 600; padding: 14px 10px; cursor: pointer; border-radius: 12px; font-size: 15px; }
.netflix-btn { background: #b1060f; }
.fbtn { width: 100%; margin-bottom: 16px; padding: 13px; cursor: pointer; font-weight: 600; background: var(--surface); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; } .bar select { flex: 1 1 130px; }
.stats { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.hint { color: var(--muted); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { cursor: pointer; font-weight: 600; } .chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.genre { position: relative; overflow: hidden; min-height: 120px; margin-bottom: 14px; padding: 14px 12px 8px; border-radius: 18px; border: 1px solid var(--line); --c: hsl(var(--h) 65% 48%); background: hsl(var(--h) 60% 50% / .1); }
#disney .genre { margin: 0; }
.genre h2 { position: relative; z-index: 1; display: inline-block; font-size: 1.15rem; margin: 0 0 10px; padding: 5px 12px; background: var(--surface); border-radius: 10px; border-left: 6px solid var(--c); }
.genre h2 span { color: var(--muted); font-weight: 400; font-size: .9rem; }
.ghead { background: none; border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
.item { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.info { flex: 1 1 150px; min-width: 0; } .name { font-weight: 600; overflow-wrap: anywhere; } .meta { color: var(--muted); font-size: 13px; }
.item.done .name { text-decoration: line-through; opacity: .55; }
.tick { padding: 13px 16px; min-height: 48px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.item.done .tick { background: var(--c); color: #fff; border-color: var(--c); }
.del { padding: 13px 14px; min-height: 48px; cursor: pointer; color: var(--danger); }
.fsel { flex: 0 0 auto; padding: 12px 8px; font-size: 14px; max-width: 130px; min-height: 48px; }
.prog { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.prog input { flex: 1; padding: 0; accent-color: var(--c, var(--accent)); background: none; border: none; }
.prog span { font-size: 13px; color: var(--muted); min-width: 36px; text-align: right; }
.empty { color: var(--muted); text-align: center; padding: 28px 8px; }
.fold { border-top: 1px solid var(--line); padding: 10px 0; margin-top: 10px; }
.frow, .fmov { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fmov { padding: 4px 0; font-size: 15px; } .done-t { text-decoration: line-through; opacity: .6; }
.scene { position: fixed; inset: 0; z-index: -1; display: none; } .scene svg { width: 100%; height: 100%; display: block; }
body[data-svc="disney"] .scene.disney, body[data-svc="netflix"] .scene.netflix { display: block; }
body { background: #0a0814; } .stats { color: #fff; }
.scene.cinema { display: block; }
body[data-svc="disney"] .scene.cinema, body[data-svc="netflix"] .scene.cinema { display: none; }
.genre.open::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: rgba(6,4,16,.55); }
.seg { display: flex; gap: 6px; flex: 1 1 100%; }
.seg button { flex: 1; min-height: 38px; padding: 8px 4px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--c); color: #fff; border-color: var(--c); }

<main>
  <h1 class="sr">Watch list</h1>

    <div id="fList"></div>
    <p class="meta">Want a phone reminder for a folder? Tell Claude the folder and the time.</p>
  </div>
  <p class="stats" id="stats"></p>
  <div id="list"></div>
</main>

(function () {
  var items = [], folders = [];
  try { items = JSON.parse(localStorage.getItem('watchlist') || '[]'); } catch (e) { items = []; }
  try { folders = JSON.parse(localStorage.getItem('watchfolders') || '[]'); } catch (e) { folders = []; }
  if (!Array.isArray(items)) items = [];
  if (!Array.isArray(folders)) folders = [];
  var $ = function (id) { return document.getElementById(id); };
  function save() { try { localStorage.setItem('watchlist', JSON.stringify(items)); } catch (e) {} }
  function saveF() { try { localStorage.setItem('watchfolders', JSON.stringify(folders)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  var UA = navigator.userAgent, DEVICE = (/iPad/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1)) ? 'iPad' : /iPhone|Android/.test(UA) ? 'Phone' : 'Other';
  function key(it) { return it.title + '|' + it.service; }
  function pct(it) { return it.p != null ? it.p : (it.done ? 100 : 0); }
  function theme(g) {
    if (/marvel|\bdc\b|comic|super ?hero|avenger|spider|batman|x-men/i.test(g)) return 't-comic';
    if (/star wars|jedi/i.test(g)) return 't-space';
    if (/sci-?fi|space|alien|galaxy|futur/i.test(g)) return 't-scifi';
    if (/mystery|crime|detective|noir/i.test(g)) return 't-mystery';
    if (/horror|scary|thriller|spooky|zombie/i.test(g)) return 't-horror';
    if (/romance|romantic|love|rom-?com/i.test(g)) return 't-heart';
    if (/pixar/i.test(g)) return 't-pixar';
    if (/princess/i.test(g)) return 't-princess';
    if (/animat|cartoon/i.test(g)) return 't-anim';
    if (/disney|family|kids|magic|fantasy/i.test(g)) return 't-spark';
    if (/comed|funny|sitcom/i.test(g)) return 't-fun';
    if (/sport/i.test(g)) return 't-sport';
    if (/action|fight|heist|war/i.test(g)) return 't-action';
    if (/adventure/i.test(g)) return 't-adv';
    if (/documentar|nature/i.test(g)) return 't-doc';
    return '';
  }
  function segHtml(it, i) {
    var v = pct(it), cur = v >= 100 ? 2 : v > 0 ? 1 : 0;
    return '<div class="seg">' + [['Not started', 0], ['Halfway', 50], ['Finished', 100]].map(function (b, n) {
      return '<button data-s="' + i + ':' + b[1] + '" aria-pressed="' + (n === cur) + '"' + (n === cur ? ' class="on"' : '') + '>' + b[0] + '</button>';
    }).join('') + '</div>';
  }
  var CAT = {"Disney+": {"Marvel": ["Iron Man", "Iron Man 2", "Iron Man 3", "Thor", "Thor: The Dark World", "Thor: Ragnarok", "Thor: Love and Thunder", "Captain America: The First Avenger", "Captain America: The Winter Soldier", "Captain America: Civil War", "The Avengers", "Avengers: Age of Ultron", "Avengers: Infinity War", "Avengers: Endgame", "Black Panther", "Black Panther: Wakanda Forever", "Guardians of the Galaxy", "Guardians of the Galaxy Vol. 2", "Guardians of the Galaxy Vol. 3", "Doctor Strange", "Doctor Strange in the Multiverse of Madness", "Ant-Man", "Ant-Man and the Wasp", "Captain Marvel", "Black Widow", "Shang-Chi and the Legend of the Ten Rings", "Eternals", "Spider-Man: Homecoming", "Spider-Man: Far From Home", "Spider-Man: No Way Home", "The Marvels"], "Star Wars": ["Star Wars: The Phantom Menace", "Star Wars: Attack of the Clones", "Star Wars: Revenge of the Sith", "Star Wars: A New Hope", "Star Wars: The Empire Strikes Back", "Star Wars: Return of the Jedi", "Star Wars: The Force Awakens", "Star Wars: The Last Jedi", "Star Wars: The Rise of Skywalker", "Rogue One", "Solo: A Star Wars Story"], "Pixar": ["Toy Story", "Toy Story 2", "Toy Story 3", "Toy Story 4", "A Bug's Life", "Monsters, Inc.", "Finding Nemo", "The Incredibles", "Cars", "Ratatouille", "WALL-E", "Up", "Monsters University", "Brave", "Inside Out", "The Good Dinosaur", "Finding Dory", "Coco", "Incredibles 2", "Onward", "Soul", "Luca", "Turning Red", "Lightyear", "Elemental", "Inside Out 2"], "Princesses": ["Snow White and the Seven Dwarfs", "Cinderella", "Sleeping Beauty", "The Little Mermaid", "Beauty and the Beast", "Aladdin", "Pocahontas", "Mulan", "The Princess and the Frog", "Tangled", "Frozen", "Frozen II", "Moana", "Moana 2", "Raya and the Last Dragon", "Enchanted"], "Disney Classics": ["Pinocchio", "Dumbo", "Bambi", "Alice in Wonderland", "Peter Pan", "Lady and the Tramp", "One Hundred and One Dalmatians", "The Sword in the Stone", "The Jungle Book", "The Aristocats", "Robin Hood", "The Rescuers", "The Fox and the Hound", "Oliver & Company", "The Lion King", "Hercules", "Tarzan", "The Hunchback of Notre Dame", "Lilo & Stitch", "Treasure Planet", "Brother Bear", "Bolt", "Zootopia", "Big Hero 6", "Wreck-It Ralph", "Encanto", "Strange World", "Wish"], "Adventure": ["Pirates of the Caribbean: The Curse of the Black Pearl", "Pirates of the Caribbean: Dead Man's Chest", "Raiders of the Lost Ark", "Indiana Jones and the Temple of Doom", "Indiana Jones and the Last Crusade", "National Treasure", "Jungle Cruise", "Tron: Legacy", "Night at the Museum", "Percy Jackson & the Olympians: The Lightning Thief"], "Comedy": ["Home Alone", "Home Alone 2: Lost in New York", "Hocus Pocus", "Freaky Friday", "The Parent Trap", "Honey, I Shrunk the Kids", "Cheaper by the Dozen", "Cool Runnings", "Night at the Museum: Battle of the Smithsonian", "Enchanted"], "Sports": ["Remember the Titans", "The Mighty Ducks", "Cool Runnings", "Miracle", "Invincible", "Secretariat", "McFarland, USA", "Queen of Katwe", "The Rookie", "Glory Road"], "Documentary": ["Earth", "Oceans", "Chimpanzee", "Bears", "African Cats", "Penguins", "Born in China", "Elephant", "Dolphin Reef", "Free Solo", "Summer of Soul", "The Rescue"]}, "Netflix": {"Action": ["Extraction", "Extraction 2", "The Gray Man", "Red Notice", "Bright", "6 Underground", "Triple Frontier", "Army of the Dead", "The Old Guard", "Spenser Confidential", "Spectral", "Heart of Stone"], "Comedy": ["Murder Mystery", "Dolemite Is My Name", "Eurovision Song Contest: The Story of Fire Saga", "Don't Look Up", "Me Time", "Murder Mystery 2", "Hustle", "The Kissing Booth", "Wine Country"], "Horror": ["Bird Box", "The Platform", "The Ritual", "Gerald's Game", "Hush", "Apostle", "1922", "His House", "Fear Street: 1994", "Fear Street: 1978", "Fear Street: 1666"], "Romance": ["To All the Boys I've Loved Before", "To All the Boys: P.S. I Still Love You", "To All the Boys: Always and Forever", "The Kissing Booth", "Set It Up", "Always Be My Maybe", "Purple Hearts", "Falling Inn Love", "Palm Springs", "Someone Great"], "Sci-Fi": ["The Adam Project", "Okja", "I Am Mother", "Extinction", "The Cloverfield Paradox", "The Midnight Sky", "Bright", "Rim of the World"], "Mystery": ["Glass Onion", "Enola Holmes", "Enola Holmes 2", "Murder Mystery 2", "The Pale Blue Eye", "Fractured"], "Documentary": ["My Octopus Teacher", "The Social Dilemma", "Icarus", "13th", "Crip Camp", "Fyre: The Greatest Party That Never Happened", "Becoming", "Dick Johnson Is Dead", "American Factory"], "Animation": ["The Mitchells vs. the Machines", "Klaus", "Over the Moon", "The Sea Beast", "Nimona", "Wendell & Wild", "A Whisker Away", "Leo"]}};
  var dOpen = false, dTheme = null, dSvc = 'Disney+', fOpen = false, openG = {};

  function render() {
    var fv = dOpen ? dSvc : 'all', groups = {}, finished = 0;
    items.forEach(function (it, i) {
      if (it.done) finished++;
      if (fv !== 'all' && it.service !== fv) return;
      (groups[it.genre] = groups[it.genre] || []).push(i);
    });
    var html = '';
    Object.keys(groups).sort().forEach(function (g) {
      var open = !!openG[g];
      html += '<section class="genre ' + theme(g) + (open ? ' open' : '') + '" style="--h:' + hue(g) + '"><h2><button class="ghead" data-g="' + esc(g) + '" aria-expanded="' + open + '">' + esc(g) + ' <span>(' + groups[g].length + ')</span> ' + (open ? '▴' : '▾') + '</button></h2>';
      if (open) groups[g].forEach(function (i) {
        var it = items[i];
        html += '<div class="item' + (it.done ? ' done' : '') + '"><div class="info"><div class="name">' + esc(it.title) + '</div><div class="meta">' + esc(it.type) + ' · ' + esc(it.service) + ' · ' + esc(it.device) + '</div></div>' +
          (folders.length ? '<select class="fsel" data-fi="' + i + '" aria-label="Add to folder"><option value="">+ Folder</option>' + folders.map(function (f, fi) { return '<option value="' + fi + '">' + esc(f.name) + '</option>'; }).join('') + '</select>' : '') +
          '<button class="del" data-d="' + i + '" aria-label="Delete ' + esc(it.title) + '">✕</button>' + segHtml(it, i) + '</div>';
      });
      html += '</section>';
    });
    $('list').innerHTML = html || '<p class="empty">' + (items.length ? 'Nothing matches these filters.' : 'Your list is empty. Open a Browse button above and tap Add on a movie.') + '</p>';
    $('stats').textContent = items.length ? finished + ' of ' + items.length + ' finished' : '';
    renderDisney();
    renderFolders();
  }

  function renderDisney() {
    document.body.setAttribute('data-svc', dOpen ? (dSvc === 'Disney+' ? 'disney' : 'netflix') : '');
    ['Disney+', 'Netflix'].forEach(function (x) {
      var b = $(x === 'Disney+' ? 'bDisney' : 'bNetflix'), on = dOpen && dSvc === x;
      b.setAttribute('aria-expanded', on ? 'true' : 'false');
      b.textContent = (on ? 'Hide ' : 'Browse ') + x + ' themes';
    });
    var p = $('disney');
    if (!dOpen) { p.hidden = true; return; }
    p.hidden = false;
    var themes = CAT[dSvc];
    var h = '<div class="chips">' + Object.keys(themes).map(function (n) {
      return '<button class="chip' + (n === dTheme ? ' on' : '') + '" data-th="' + esc(n) + '">' + esc(n) + '</button>';
    }).join('') + '</div>';
    if (!dTheme) {
      h += '<p class="hint">Tap a theme to see its movies.</p>';
    } else {
      h += '<div class="genre open ' + theme(dTheme) + '" style="--h:' + hue(dTheme) + '"><h2>' + esc(dTheme) + '</h2>';
      themes[dTheme].forEach(function (title, n) {
        var it = items.filter(function (x) { return key(x) === title + '|' + dSvc; })[0], idx = it ? items.indexOf(it) : -1, v = it ? pct(it) : 0;
        h += '<div class="item' + (it && it.done ? ' done' : '') + '"><div class="info"><div class="name">' + esc(title) + '</div>' +
          (it ? '<div class="meta">In your list' + (v > 0 && v < 100 ? ' · Watching ' + v + '%' : '') + '</div>' : '') + '</div>' +
          (it ? segHtml(it, idx) : '<button class="tick" data-a="' + n + '">Add</button>') + '</div>';
      });
      h += '</div>';
    }
    p.innerHTML = h;
  }

  function renderFolders() {
    $('bFolders').setAttribute('aria-expanded', fOpen ? 'true' : 'false');
    $('bFolders').textContent = fOpen ? 'Hide my folders' : 'My folders (' + folders.length + ')';
    $('folders').hidden = !fOpen;
    if (!fOpen) return;
    var h = '';
    folders.forEach(function (f, fi) {
      var when = f.when ? new Date(f.when).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
      h += '<div class="fold"><div class="frow"><div><strong>' + esc(f.name) + '</strong>' + (when ? '<div class="meta">Watch: ' + esc(when) + '</div>' : '') + '</div><button class="del" data-fdel="' + fi + '" aria-label="Delete folder ' + esc(f.name) + '">✕</button></div>';
      var any = false;
      f.keys.forEach(function (k, ki) {
        var it = items.filter(function (x) { return key(x) === k; })[0];
        if (!it) return;
        any = true;
        h += '<div class="fmov"><span class="' + (it.done ? 'done-t' : '') + '">' + esc(it.title) + '</span><button class="del" data-frm="' + fi + '" data-k="' + ki + '" aria-label="Remove from folder">✕</button></div>';
      });
      if (!any) h += '<div class="meta">Empty. Open a genre and use + Folder on a title.</div>';
      h += '</div>';
    });
    $('fList').innerHTML = h || '<p class="meta">No folders yet. Name one above and tap Create folder.</p>';
  }

  function openSvc(x) {
    if (dOpen && dSvc === x) { dOpen = false; }
    else { if (dSvc !== x) dTheme = null; dSvc = x; dOpen = true; }
    render();
  }
  $('bDisney').addEventListener('click', function () { openSvc('Disney+'); });
  $('bNetflix').addEventListener('click', function () { openSvc('Netflix'); });
  $('bFolders').addEventListener('click', function () { fOpen = !fOpen; renderFolders(); });
  $('fMake').addEventListener('click', function () {
    var n = $('fName').value.trim();
    if (!n) { $('fName').focus(); return; }
    folders.push({ name: n, when: $('fWhen').value || '', keys: [] });
    $('fName').value = ''; $('fWhen').value = '';
    saveF(); render();
  });
  $('fList').addEventListener('click', function (e) {
    var d = e.target.closest('[data-fdel]'), r = e.target.closest('[data-frm]');
    if (d) { folders.splice(+d.getAttribute('data-fdel'), 1); saveF(); render(); }
    else if (r) { folders[+r.getAttribute('data-frm')].keys.splice(+r.getAttribute('data-k'), 1); saveF(); render(); }
  });
  $('list').addEventListener('input', function (e) {
    var r = e.target.closest('[data-p]');
    if (r && r.nextElementSibling) r.nextElementSibling.textContent = r.value + '%';
  });
  $('list').addEventListener('change', function (e) {
    var r = e.target.closest('[data-p]'), f = e.target.closest('[data-fi]');
    if (r) {
      var i = +r.getAttribute('data-p');
      items[i].p = +r.value; items[i].done = items[i].p >= 100; save(); render();
    } else if (f && f.value !== '') {
      var k = key(items[+f.getAttribute('data-fi')]), fo = folders[+f.value];
      if (fo && fo.keys.indexOf(k) < 0) fo.keys.push(k);
      saveF(); render();
    }
  });
  $('list').addEventListener('click', function (e) {
    var g = e.target.closest('[data-g]'), t = e.target.closest('[data-t]'), w = e.target.closest('[data-w]'), d = e.target.closest('[data-d]');
    if (g) { var n = g.getAttribute('data-g'); openG[n] = !openG[n]; render(); }
    else if (w) { items[+w.getAttribute('data-w')].p = 10; save(); render(); }
    else if (t) { var i = +t.getAttribute('data-t'); items[i].done = !items[i].done; items[i].p = items[i].done ? 100 : 0; save(); render(); }
    else if (d) { items.splice(+d.getAttribute('data-d'), 1); save(); render(); }
  });
  $('disney').addEventListener('click', function (e) {
    var c = e.target.closest('[data-th]'), a = e.target.closest('[data-a]'), t = e.target.closest('[data-tt]'), w = e.target.closest('[data-w]');
    if (c) { dTheme = c.getAttribute('data-th'); renderDisney(); }
    else if (a) {
      items.push({ title: CAT[dSvc][dTheme][+a.getAttribute('data-a')], type: 'Movie', service: dSvc, device: DEVICE, genre: dTheme, done: false, p: 0 });
      save(); render();
    } else if (t) { var i = +t.getAttribute('data-tt'); items[i].done = !items[i].done; items[i].p = items[i].done ? 100 : 0; save(); render(); }
    else if (w) { items[+w.getAttribute('data-w')].p = 10; save(); render(); }
  });
  function setP(b) {
    var a = b.getAttribute('data-s').split(':'), i = +a[0], v = +a[1];
    items[i].p = v; items[i].done = v >= 100; save(); render();
  }
  ['list', 'disney'].forEach(function (id) {
    $(id).addEventListener('click', function (e) { var b = e.target.closest('[data-s]'); if (b) setP(b); });
  });
  render();
})();
</script>
</body>
</html>
